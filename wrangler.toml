name = "ns-reisplanner-mvp"
main = "src/index.ts"
compatibility_date = "2026-10-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
NS_API_BASE_URL = "https://gateway.apiportal.ns.nl/reisinformatie-api/api"
LOG_LEVEL = "info"
MCP_RATE_LIMIT_PER_MINUTE = "45"

[[durable_objects.bindings]]
name = "MCP_RATE_LIMITER"
class_name = "McpRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["McpRateLimiter"]

# Provision NS_API_KEY separately as a Worker secret.
